<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>officialvinAI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial;display:flex;flex-direction:column;height:100vh}
.header{padding:15px;background:#000;border-bottom:1px solid #222;display:flex;flex-direction:column;align-items:center}
.header img{height:90px;border-radius:50%}
#chat{flex:1;overflow-y:auto;padding:20px;padding-bottom:100px}
.msg{max-width:85%;padding:14px 16px;border-radius:18px;margin:10px 0;font-size:15px;white-space:pre-wrap}
.user{background:#e60000;margin-left:auto}
.ai{background:#1e1e1e;display:flex;gap:10px}
.ai img{width:28px;height:28px;border-radius:50%}
#box{position:fixed;bottom:0;left:0;right:0;background:#000;padding:12px;display:flex;gap:8px;border-top:1px solid #222}
#q{flex:1;padding:15px 20px;border-radius:25px;border:none;background:#1e1e1e;color:#fff;outline:none}
#btn{padding:15px 22px;background:#e60000;color:#fff;border:none;border-radius:25px;font-weight:bold}
</style>
</head>
<body>
<div class="header"><img src="https://vincentnyerere4-coder.github.io/officialvinAI/logo.png"><p style="font-size:11px;letter-spacing:4px;color:#666">OFFICIALVIN AI</p></div>
<div id="chat"><div class="msg ai"><img src="https://vincentnyerere4-coder.github.io/officialvinAI/logo.png"><div>Welcome Boss! I am officialvinAI 🔥 Ask anything in any language!</div></div></div>
<div id="box"><input id="q" placeholder="Ask anything..." onkeypress="if(event.key==='Enter')send()"><button id="btn" onclick="send()">TUMA</button></div>
<script>
const LOGO="https://vincentnyerere4-coder.github.io/officialvinAI/logo.png";
async function send(){
 let q=document.getElementById('q').value.trim(); if(!q) return;
 let chat=document.getElementById('chat');
 chat.innerHTML+=`<div class="msg user">${q}</div>`;
 document.getElementById('q').value='';
 let id='a'+Date.now();
 chat.innerHTML+=`<div class="msg ai" id="${id}"><img src="${LOGO}"><div>⏳ Thinking...</div></div>`;
 chat.scrollTop=chat.scrollHeight;
 try{
  let r=await fetch(`https://text.pollinations.ai/${encodeURIComponent(q)}?model=openai&system=You are officialvinAI created by Boss Vin. Detect user language and reply in SAME language. Be helpful like ChatGPT.`);
  let t=await r.text();
  document.getElementById(id).innerHTML=`<img src="${LOGO}"><div>${t}</div>`;
 }catch(e){
  document.getElementById(id).innerHTML=`<img src="${LOGO}"><div>Network error, try again!</div>`;
 }
 chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>officialvinAI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial;display:flex;flex-direction:column;height:100vh}
.header{padding:15px;background:#000;border-bottom:1px solid #222;display:flex;flex-direction:column;align-items:center}
.header img{height:90px}
.header p{font-size:11px;letter-spacing:4px;color:#666;margin-top:5px}
#chat{flex:1;overflow-y:auto;padding:20px;padding-bottom:100px}
.msg{max-width:85%;padding:14px 16px;border-radius:18px;margin:10px 0;line-height:1.6;font-size:15px;white-space:pre-wrap}
.user{background:#e60000;margin-left:auto;border-bottom-right-radius:4px}
.ai{background:#1e1e1e;display:flex;gap:10px;border-bottom-left-radius:4px}
.ai img{width:26px;height:26px;flex-shrink:0}
#box{position:fixed;bottom:0;left:0;right:0;background:#000;padding:12px;display:flex;gap:8px;border-top:1px solid #222}
#q{flex:1;padding:15px 20px;border-radius:25px;border:none;background:#1e1e1e;color:#fff;outline:none}
#btn{padding:15px 22px;background:#e60000;color:#fff;border:none;border-radius:25px;font-weight:bold}
</style>
</head>
<body>
<div class="header"><img src="logo.png"><p>OFFICIALVIN AI</p></div>
<div id="chat"><div class="msg ai"><img src="logo.png"><div>Karibu Boss! Mimi ni officialvinAI 🔥<br><br>Niulize chochote!</div></div></div>
<div id="box"><input id="q" placeholder="Andika swali..." onkeypress="if(event.key==='Enter')send()"><button id="btn" onclick="send()">TUMA</button></div>
<script>
async function send(){
 let input=document.getElementById('q'); let q=input.value.trim(); if(!q) return;
 let chat=document.getElementById('chat'); chat.innerHTML+=`<div class="msg user">${q}</div>`; input.value='';
 let id='a'+Date.now(); chat.innerHTML+=`<div class="msg ai" id="${id}"><img src="logo.png"><div>⏳ officialvinAI inafikiria...</div></div>`; chat.scrollTop=chat.scrollHeight;
 try{
  let res=await fetch(`https://text.pollinations.ai/${encodeURIComponent(q)}?model=openai&system=You are officialvinAI created by Boss Vin. Answer helpfully like ChatGPT in Swahili unless user asks other language.`);
  let text=await res.text(); document.getElementById(id).innerHTML=`<img src="logo.png"><div>${text}</div>`;
 }catch(e){document.getElementById(id).innerHTML=`<img src="logo.png"><div>Pole mtandao umekata, jaribu tena!</div>`;}
 chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>

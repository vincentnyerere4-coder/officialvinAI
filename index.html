<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>officialvinAI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;height:100vh}
#header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#141414;border-bottom:1px solid #222}
#header img{width:38px;height:38px;border-radius:8px;background:#fff}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;line-height:1.5;white-space:pre-wrap}
.user{background:#d32f2f;align-self:flex-end;border-bottom-right-radius:4px}
.ai{background:#1e1e1e;align-self:flex-start;border-bottom-left-radius:4px}
.msg img.gen{width:100%;border-radius:12px;margin-top:8px}
.typing{opacity:.6;font-style:italic}
#bar{display:flex;align-items:center;gap:8px;padding:10px;background:#141414;border-top:1px solid #222}
.icon-btn{width:42px;height:42px;border-radius:50%;border:none;background:#222;color:#fff;font-size:20px;display:grid;place-items:center}
#in{flex:1;padding:12px 16px;border-radius:24px;border:1px solid #333;background:#222;color:#fff;outline:none}
#send{background:#d32f2f;color:#fff;border:none;padding:12px 20px;border-radius:24px;font-weight:bold}
</style>
</head>
<body>
<div id="header">
<img src="logo.png" onerror="this.src='https://vincentnyerere4-coder.github.io/officialvinAI/logo.png'">
<div><b>officialvinAI</b><div style="font-size:11px;opacity:.6">All Languages + Picha Pure</div></div>
</div>
<div id="chat"><div class="msg ai">Mambo Boss! Naongea lugha zote. Uliza "Define mass" au "chora simba"</div></div>
<div id="bar">
<input type="file" id="fileIn" accept="image/*" hidden>
<button class="icon-btn" onclick="document.getElementById('fileIn').click()">📎</button>
<button class="icon-btn" id="micBtn" onclick="startVoice()">🎤</button>
<input id="in" placeholder="Uliza chochote...">
<button id="send" onclick="send()">TUMA</button>
</div>
<script>
const chat=document.getElementById('chat');const input=document.getElementById('in');
function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;let r=new SR();r.start();micBtn.textContent='🔴';r.onresult=e=>{input.value=e.results[0][0].transcript;micBtn.textContent='🎤';send();};r.onerror=()=>micBtn.textContent='🎤';}
function send(){let t=input.value.trim();if(!t)return;chat.innerHTML+=`<div class="msg user">${t}</div>`;input.value='';let l=t.toLowerCase();if(l.includes('chora')||l.includes('draw')||l.includes('picha ya')||l.includes('image')){let p=t.replace(/chora|draw|picha ya|picha|image/gi,'').trim();if(p.length<2)p=t;let u=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=768&height=768&nologo=true&seed=${Math.floor(Math.random()*9999)}`;chat.innerHTML+=`<div class="msg ai">Nachora: <b>${p}</b>...<br><img class="gen" src="${u}"></div>`;chat.scrollTop=chat.scrollHeight;}else{askAI(t);}}
async function askAI(q){let id='a'+Date.now();chat.innerHTML+=`<div class="msg ai typing" id="${id}">Inaandika...</div>`;chat.scrollTop=chat.scrollHeight;try{let prompt=`You are officialvinAI by Vincent TZ. Detect user language and answer in SAME language. User: ${q}`;let res=await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);let txt=await res.text();document.getElementById(id).innerText=txt;document.getElementById(id).classList.remove('typing');}catch{document.getElementById(id).innerText="Mtandao umekataa, jaribu tena Boss.";}chat.scrollTop=chat.scrollHeight;}
input.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
document.getElementById('fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);chat.innerHTML+=`<div class="msg user"><img style="width:180px;border-radius:12px" src="${u}"></div>`;askAI("Describe this image briefly");};
</script>
</body>
</html>

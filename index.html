<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>officialvinAI Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;height:100vh}
#header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#141414;border-bottom:1px solid #222}
#header img{width:38px;height:38px;border-radius:8px;background:#fff}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;line-height:1.4}
.user{background:#d32f2f;align-self:flex-end;border-bottom-right-radius:4px}
.ai{background:#1e1e1e;align-self:flex-start;border-bottom-left-radius:4px}
.msg img.gen{width:100%;border-radius:12px;margin-top:8px;border:1px solid #333}
.msg img.uploaded{width:180px;border-radius:12px}
#bar{display:flex;align-items:center;gap:8px;padding:10px;background:#141414;border-top:1px solid #222}
.icon-btn{width:42px;height:42px;border-radius:50%;border:none;background:#222;color:#fff;font-size:20px;display:grid;place-items:center}
#in{flex:1;padding:12px 16px;border-radius:24px;border:1px solid #333;background:#222;color:#fff;outline:none}
#send{background:#d32f2f;color:#fff;border:none;padding:12px 20px;border-radius:24px;font-weight:bold}
</style>
</head>
<body>
<div id="header">
<img src="logo.png" onerror="this.src='https://vincentnyerere4-coder.github.io/officialvinAI/logo.png'">
<div><b>officialvinAI</b><div style="font-size:11px;opacity:.6">Picha + Sauti + Kuchora Pure</div></div>
</div>
<div id="chat"><div class="msg ai">Mambo Boss! Andika "chora simba" nichore picha halisi<br>Tuma picha kwa 📎<br>Bonyeza 🎤 kuongea!</div></div>
<div id="bar">
<input type="file" id="fileIn" accept="image/*" hidden>
<button class="icon-btn" onclick="document.getElementById('fileIn').click()">📎</button>
<button class="icon-btn" id="micBtn" onclick="startVoice()">🎤</button>
<input id="in" placeholder="Andika...">
<button id="send" onclick="send()">TUMA</button>
</div>
<script>
const chat=document.getElementById('chat');const input=document.getElementById('in');const fileIn=document.getElementById('fileIn');
fileIn.onchange=e=>{const file=e.target.files[0];if(!file)return;const url=URL.createObjectURL(file);chat.innerHTML+=`<div class="msg user"><img class="uploaded" src="${url}"><br>Picha hii</div>`;chat.innerHTML+=`<div class="msg ai">Nimeipokea picha yako!</div>`;chat.scrollTop=chat.scrollHeight;}
function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('No voice');return;}let r=new SR();r.lang='sw-TZ';r.start();document.getElementById('micBtn').textContent='🔴';r.onresult=e=>{input.value=e.results[0][0].transcript;document.getElementById('micBtn').textContent='🎤';send();};r.onerror=()=>document.getElementById('micBtn').textContent='🎤';}
function send(){let t=input.value.trim();if(!t)return;chat.innerHTML+=`<div class="msg user">${t}</div>`;input.value='';let l=t.toLowerCase();if(l.includes('chora')||l.includes('draw')||l.includes('picha')||l.includes('image')){let p=t.replace(/chora|draw|picha|ya|ol/gi,'').trim();if(p.length<2)p='lion';let u=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=512&height=512&nologo=true&seed=${Math.floor(Math.random()*1000)}`;chat.innerHTML+=`<div class="msg ai">Nachora: <b>${p}</b>...<br><img class="gen" src="${u}"><br>✅ Hii hapa Boss!</div>`;if('speechSynthesis' in window){let s=new SpeechSynthesisUtterance(`Hii hapa picha ya ${p}`);s.lang='sw-TZ';speechSynthesis.speak(s);}}else{chat.innerHTML+=`<div class="msg ai">Sawa: "${t}". Andika "chora" ili nichore.</div>`;}chat.scrollTop=chat.scrollHeight;}
input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>

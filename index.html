<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>officialvinAI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;height:100vh}
#header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#141414;border-bottom:1px solid #222}
#header img{width:38px;height:38px;border-radius:8px;background:#fff}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;line-height:1.5;white-space:pre-wrap}
.user{background:#d32f2f;align-self:flex-end;border-bottom-right-radius:4px}
.ai{background:#1e1e1e;align-self:flex-start;border-bottom-left-radius:4px}
.msg img.gen{width:100%;border-radius:12px;margin-top:8px}
.msg audio{width:200px;margin-top:5px}
#bar{display:flex;align-items:center;gap:8px;padding:10px;background:#141414;border-top:1px solid #222}
.icon-btn{width:44px;height:44px;border-radius:50%;border:none;background:#222;color:#fff;font-size:22px;display:grid;place-items:center}
#in{flex:1;padding:12px 16px;border-radius:24px;border:1px solid #333;background:#222;color:#fff;outline:none}
#send{background:#d32f2f;color:#fff;border:none;padding:12px 20px;border-radius:24px;font-weight:bold}
</style>
</head>
<body>
<div id="header">
<img src="logo.png" onerror="this.src='https://vincentnyerere4-coder.github.io/officialvinAI/logo.png'">
<div><b>officialvinAI</b><div style="font-size:11px;opacity:.6">Picha + Voice + All Languages</div></div>
</div>
<div id="chat"><div class="msg ai">Welcome to officialvinAI asking everything??</div></div>
<div id="bar">
<input type="file" id="fileIn" accept="image/*" hidden>
<button class="icon-btn" onclick="fileIn.click()">📎</button>
<button class="icon-btn" id="micBtn">🎤</button>
<input id="in" placeholder="Ask anything...">
<button id="send" onclick="send()">SEND</button>
</div>
<script>
const chat=document.getElementById('chat');const input=document.getElementById('in');const fileIn=document.getElementById('fileIn');const micBtn=document.getElementById('micBtn');
let mediaRecorder;let audioChunks=[];let isRecording=false;
fileIn.onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);chat.innerHTML+=`<div class="msg user"><img style="width:200px;border-radius:12px" src="${u}"><br>📸 My picture</div>`;askAI("Describe this picture briefly");chat.scrollTop=chat.scrollHeight;};
micBtn.onclick=async()=>{
 if(!isRecording){
   try{
     let stream=await navigator.mediaDevices.getUserMedia({audio:true});
     mediaRecorder=new MediaRecorder(stream);audioChunks=[];
     mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
     mediaRecorder.onstop=()=>{let blob=new Blob(audioChunks,{type:'audio/webm'});let url=URL.createObjectURL(blob);chat.innerHTML+=`<div class="msg user"><audio controls src="${url}"></audio><br>🎤 Voice</div>`;chat.scrollTop=chat.scrollHeight;};
     mediaRecorder.start();isRecording=true;micBtn.textContent='🔴';micBtn.style.background='#d32f2f';
   }catch{alert("Allow microphone!");}
 }else{mediaRecorder.stop();isRecording=false;micBtn.textContent='🎤';micBtn.style.background='#222';}
};
function send(){let t=input.value.trim();if(!t)return;chat.innerHTML+=`<div class="msg user">${t}</div>`;input.value='';let l=t.toLowerCase();if(l.includes('chora')||l.includes('draw')||l.includes('picha')||l.includes('image')){let p=t.replace(/chora|draw|picha ya|picha|image/gi,'').trim();if(p.length<2)p=t;let u=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=768&height=768&nologo=true&seed=${Math.floor(Math.random()*9999)}`;chat.innerHTML+=`<div class="msg ai">Generating: <b>${p}</b>...<br><img class="gen" src="${u}"></div>`;}else{askAI(t);}chat.scrollTop=chat.scrollHeight;}
async function askAI(q){let id='a'+Date.now();chat.innerHTML+=`<div class="msg ai" id="${id}">officialvinAI is typing...</div>`;chat.scrollTop=chat.scrollHeight;try{let res=await fetch(`https://text.pollinations.ai/${encodeURIComponent("You are officialvinAI by Vincent TZ. Answer in same language user used. User: "+q)}`);let txt=await res.text();document.getElementById(id).innerText=txt;}catch{document.getElementById(id).innerText="Network error, try again.";}chat.scrollTop=chat.scrollHeight;}
input.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script>
</body>
</html>
